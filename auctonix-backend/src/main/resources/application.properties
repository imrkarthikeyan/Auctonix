spring.application.name=Auctonix Backend

server.port=${PORT:8080}


#spring.datasource.url=${jdbc:mysql://localhost:3306/auctonix_dbL}
#spring.datasource.username=${root}
#spring.datasource.password=${Karthi@123}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${DB_URL:${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/auctonix?sslmode=require}}
spring.datasource.username=${DB_USERNAME:${SUPABASE_DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SUPABASE_DB_PASSWORD:postgres}}


spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.maximum-pool-size=10

logging.level.org.springframework=INFO
logging.level.com.bidnow=DEBUG

jwt.secret=${JWT_SECRET:BidNowSecretKey123456}
jwt.expiration=${JWT_EXPIRATION:86400000}


ml.service.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}

spring.websocket.message-broker.enabled=true


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:uploads/